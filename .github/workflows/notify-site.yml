name: 通知站点重建

# 推送文章 / 配图后，调用 Cloudflare Workers Deploy Hook 让站点自动重建。
# hook 地址存在仓库 secret：CF_DEPLOY_HOOK
on:
  push:
    branches: [main]
  # 允许在 Actions 页手动重跑（比如某次调用失败）
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 触发 Cloudflare 构建
        env:
          DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "缺少 CF_DEPLOY_HOOK secret，无法触发站点重建" >&2
            exit 1
          fi
          curl -fsS -X POST "$DEPLOY_HOOK"